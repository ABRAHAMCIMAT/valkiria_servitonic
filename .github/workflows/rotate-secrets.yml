name: Rotar secretos GCP

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Entorno"
        type: choice
        options: [dev, prod]
        required: true
      operation:
        description: "Etapa de rotación"
        type: choice
        options: [api-keys-overlap, api-keys-finalize, teams-bot]
        required: true
      change_ticket:
        description: "Ticket o autorización del cambio"
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      ALLOWED_ORIGIN: ${{ vars.CORS_ORIGIN }}
      SECURITY_USER_KEY_CURRENT: ${{ secrets.SECURITY_USER_KEY }}
      SECURITY_AGENT_KEY_CURRENT: ${{ secrets.SECURITY_AGENT_KEY }}
      SECURITY_ADMIN_KEY_CURRENT: ${{ secrets.SECURITY_ADMIN_KEY }}
      SECURITY_USER_KEY_NEXT: ${{ secrets.SECURITY_USER_KEY_NEXT }}
      SECURITY_AGENT_KEY_NEXT: ${{ secrets.SECURITY_AGENT_KEY_NEXT }}
      SECURITY_ADMIN_KEY_NEXT: ${{ secrets.SECURITY_ADMIN_KEY_NEXT }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install httpx

      - name: Seleccionar material de rotación
        id: material
        env:
          API_KEYS_OVERLAP: ${{ secrets.API_KEYS_ROTATION_OVERLAP }}
          API_KEYS_FINAL: ${{ secrets.API_KEYS_ROTATION_FINAL }}
          BOT_PASSWORD_NEXT: ${{ secrets.TEAMS_BOT_APP_PASSWORD_NEXT }}
        run: |
          set -euo pipefail
          case '${{ inputs.operation }}' in
            api-keys-overlap) VALUE="$API_KEYS_OVERLAP"; SECRET_ID=api-keys; ENV_NAME=API_KEYS ;;
            api-keys-finalize) VALUE="$API_KEYS_FINAL"; SECRET_ID=api-keys; ENV_NAME=API_KEYS ;;
            teams-bot) VALUE="$BOT_PASSWORD_NEXT"; SECRET_ID=teams-bot-app-password; ENV_NAME=TEAMS_BOT_APP_PASSWORD ;;
          esac
          test -n "$VALUE" || { echo "::error::Falta el secreto de rotación requerido"; exit 1; }
          printf '%s' "$VALUE" > /tmp/rotation-value
          echo "secret_id=$SECRET_ID" >> "$GITHUB_OUTPUT"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"

      - name: Agregar versión en Secret Manager
        run: |
          gcloud secrets versions add '${{ steps.material.outputs.secret_id }}' \
            --project "$PROJECT_ID" --data-file=/tmp/rotation-value
          rm -f /tmp/rotation-value

      - name: Crear revisión con el secreto nuevo
        run: |
          gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
            --update-secrets '${{ steps.material.outputs.env_name }}=${{ steps.material.outputs.secret_id }}:latest' \
            --update-env-vars "SECRET_ROTATION_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --quiet

      - name: Resolver URL y validar revisión
        id: service
        run: |
          if [ '${{ inputs.operation }}' = 'teams-bot' ]; then
            export SECURITY_USER_KEY="$SECURITY_USER_KEY_CURRENT"
            export SECURITY_AGENT_KEY="$SECURITY_AGENT_KEY_CURRENT"
            export SECURITY_ADMIN_KEY="$SECURITY_ADMIN_KEY_CURRENT"
          else
            export SECURITY_USER_KEY="$SECURITY_USER_KEY_NEXT"
            export SECURITY_AGENT_KEY="$SECURITY_AGENT_KEY_NEXT"
            export SECURITY_ADMIN_KEY="$SECURITY_ADMIN_KEY_NEXT"
          fi
          for name in SECURITY_USER_KEY SECURITY_AGENT_KEY SECURITY_ADMIN_KEY; do
            test -n "${!name:-}" || { echo "::error::Falta $name para validar la rotación"; exit 1; }
          done
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" \
            --region "$REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          python scripts/security_smoke.py --base-url "$URL" --allowed-origin "$ALLOWED_ORIGIN"

      - name: Registrar evidencia sin valores secretos
        run: |
          mkdir -p evidence
          cat > evidence/rotation-${{ inputs.environment }}-${GITHUB_RUN_ID}.md <<EOF
          # Rotación de secreto

          - Fecha UTC: $(date -u +%FT%TZ)
          - Entorno: ${{ inputs.environment }}
          - Operación: ${{ inputs.operation }}
          - Secret Manager ID: ${{ steps.material.outputs.secret_id }}
          - Ticket: ${{ inputs.change_ticket }}
          - Commit: $GITHUB_SHA
          - Resultado del smoke test: aprobado
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: rotation-${{ inputs.environment }}-${{ github.run_id }}
          path: evidence/
          retention-days: 365
